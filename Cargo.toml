[package]
name = "rssdude"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "rssdude"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
native_db = "0.8"
native_model = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
feed-rs = "2"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
nanoid = "0.4"
once_cell = "1"
humantime = "2"
html2text = "0.12"
stop-words = "0.8"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
toml = "0.8"
axum = "0.8"
opml = "1.1"
readability = { version = "0.3", default-features = false }
urlencoding = "2"
tabled = "0.17"
linkify = "0.10"
textwrap = "0.16.2"
terminal-light = "1"

[dev-dependencies]
insta = "1"
