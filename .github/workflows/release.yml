name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build aarch64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install libiconv
        run: brew install libiconv

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          LIBRARY_PATH: /opt/homebrew/opt/libiconv/lib
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package tarball
        run: |
          mkdir -p dist
          tar czf "dist/rssdude-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" \
            -C "target/aarch64-apple-darwin/release" rssdude
          shasum -a 256 "dist/rssdude-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" \
            > "dist/rssdude-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256"
          cat "dist/rssdude-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rssdude-aarch64-apple-darwin
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
