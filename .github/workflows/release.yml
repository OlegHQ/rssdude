name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - run: cargo install --locked cargo-zigbuild

      - name: Cross-compile (Linux → ${{ matrix.target }})
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          tar czf "dist/rssdude-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" rssdude
          shasum -a 256 "dist/rssdude-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            > "dist/rssdude-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"
          cat "dist/rssdude-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rssdude-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
