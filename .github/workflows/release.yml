name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libiconv
        run: brew install libiconv

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          LIBRARY_PATH: /opt/homebrew/opt/libiconv/lib:/usr/local/opt/libiconv/lib
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          tar czf "dist/rssdude-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" rssdude
          shasum -a 256 "dist/rssdude-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            > "dist/rssdude-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"
          cat "dist/rssdude-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rssdude-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
